spring.application.name=Beetle
# Configuración PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beetle_db}
spring.datasource.username=${DB_USERNAME:beetle_user}
spring.datasource.password=${DB_PASSWORD:beetle_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Para evitar problemas de timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logs para debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Gmail OAuth2 configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=proyectswireframes@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gmail.oauth.clientId=${GMAIL_CLIENT_ID}
gmail.oauth.clientSecret=${GMAIL_CLIENT_SECRET}
gmail.oauth.refreshToken=${GMAIL_REFRESH_TOKEN}

# SupaBase configuration
supabase.bucket=avatars
supabase.url=https://pflscsouehyaspenrtbt.supabase.co
supabase.serviceRoleKey=${SB_SERVICE_ROLE_KEY}


app.frontend.url=http://localhost:3000

server.port=${PORT:8080}